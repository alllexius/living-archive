  <link rel="stylesheet" href="style.css?v=7">
  <link rel="stylesheet" href="interference.css?v=7">

  <style>
    /* Page-specific. Kept here rather than in interference.css so
       nothing shared gets regenerated or overwritten. */

    /* Breathing room beneath the fixed name and title. */
    .req { padding-top: 3rem; }

    .req .field-label,
    .req legend {
      display: block;
      font-family: var(--data);
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ash);
      margin-bottom: 0.9rem;
    }


    /* ---- CALENDAR ---------------------------------------------
       Drawn by the page, not the browser, so every unavailable
       date can be greyed — the native picker can only grey dates
       before the window, never a range in the middle.

       Hover follows rule 3 of style.css: in at 0.15s, out over 4s. */
    .cal { width: min(100%, 22rem); font-family: var(--data); }

    .cal-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .cal-month {
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--bone);
    }
    .cal-nav {
      background: none;
      border: none;
      font: inherit;
      font-size: 1rem;
      color: var(--ash);
      padding: 0.2rem 0.6rem;
      transition: color 4s ease-out;
    }
    .cal-nav:hover:not(:disabled) { color: var(--lit); transition: color 0.15s ease-in; }
    .cal-nav:disabled { color: transparent; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.2rem;
    }
    .cal-dow {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      color: var(--ash);
      text-align: center;
      padding-bottom: 0.5rem;
    }
    .cal-day {
      aspect-ratio: 1;
      background: none;
      border: 1px solid transparent;
      font: inherit;
      font-size: 0.85rem;
      color: var(--bone);
      transition: color 4s ease-out, border-color 4s ease-out;
    }
    .cal-day:hover:not(:disabled) {
      color: var(--lit);
      border-color: var(--veil);
      transition: color 0.15s ease-in, border-color 0.15s ease-in;
    }
    .cal-day:focus-visible { outline: 1px solid var(--bone); outline-offset: 2px; }

    /* Greyed: before the window, beyond the limit, or away. */
    .cal-day:disabled { color: var(--veil); }

    /* Away dates carry a faint strike as well, so they read as
       withheld rather than simply past. */
    .cal-day.is-away {
      text-decoration: line-through;
      text-decoration-color: var(--ash);
    }

    .cal-day[aria-pressed="true"] {
      color: var(--lit);
      border-color: var(--ash);
    }


    /* ---- SESSIONS --------------------------------------------- */
    .req fieldset { border: none; }
    .req .session-opt {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin: 0 2.2rem 0 0;
      font-family: var(--data);
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      color: var(--bone);
    }
    .req input[type="radio"] {
      color-scheme: dark;
      accent-color: var(--bone);
      margin: 0;
    }


    /* ---- NOTE, BUTTON, FALLBACK ------------------------------- */
    #req-note {
      min-height: 1.6em;           /* reserve the line so nothing jumps */
      margin-top: 1.4rem;
      font-family: var(--data);
      font-size: 0.75rem;
    }

    #req-send[aria-disabled="true"] {
      color: var(--ash);
      border-bottom-color: transparent;
      pointer-events: none;
    }

    #req-fallback pre {
      margin-top: 1rem;
      font-family: var(--data);
      font-size: 0.75rem;
      line-height: 1.8;
      color: var(--ash);
      white-space: pre-wrap;
      user-select: text;
    }
  </style>
</head>
<body>

<canvas id="field-canvas" aria-hidden="true"></canvas>

<a href="index.html" id="site-title">Alexius</a>

<h1 id="page-title">Request</h1>

<button id="veil-btn" type="button"
        aria-label="Shift the field"
        aria-expanded="false"
        aria-controls="centre-nav"></button>

<nav id="centre-nav" aria-label="Site">
  <a href="index.html">Condition</a>
  <a href="archive.html">Archive</a>
  <a href="field-notes.html">Field Notes</a>
  <a href="contact.html">Contact</a>
</nav>

<div id="invert-veil" aria-hidden="true"></div>


<div class="page">

  <main class="prose req">

    <div>
      <span class="field-label" id="req-cal-label">Date</span>
      <div id="req-cal" class="cal" role="group" aria-labelledby="req-cal-label"></div>
    </div>

    <fieldset style="margin-top:2.4rem;">
      <legend>Session</legend>
      <div id="req-sessions"></div>
    </fieldset>

    <p id="req-note" class="quiet" aria-live="polite"></p>

    <p style="margin-top:2.5rem;">
      <a href="#" id="req-send" aria-disabled="true">Write the request</a>
    </p>

    <!-- Revealed only after the button is pressed, in case the
         visitor has no mail app set up and nothing opened. -->
    <div id="req-fallback" class="quiet" hidden style="margin-top:2.5rem;">
      <p>If no email opened, write to <a id="req-addr" href="#"></a> with:</p>
      <pre id="req-template"></pre>
    </div>

    <noscript>
      <p class="quiet">Requests can also be sent through the <a href="contact.html">Contact</a> page.</p>
    </noscript>

  </main>

  <div></div>

</div>

<div id="cursor" aria-hidden="true"><img src="assets/cursor.png" alt=""></div>
<script src="cursor.js?v=7"></script>
<script src="interference.js?v=7"></script>

<script>
/* ============================================================
   THE REQUEST

   Everything I will ever need to edit is in this first block.
   ============================================================ */

var CONFIG = {

  // Days ahead before a date can be requested. 14 = two weeks.
  // Counted from the visitor's today, so it rolls forward daily.
  LEAD_DAYS: 14,

  // Furthest ahead someone may ask, in days. null = no limit.
  MAX_DAYS: 60,

  // UNAVAILABLE DATES. Inclusive, YYYY-MM-DD, one line each,
  // comma at the end of every line. Delete lines as they pass.
  // These are greyed and struck through in the calendar.
  //
  //   a trip:        ["2027-08-01", "2027-10-31"],
  //   a single day:  ["2026-11-20", "2026-11-20"],
  AWAY: [
    ["2026-11-06", "2026-11-06"],
    ["2026-11-14", "2026-11-14"],
    ["2026-11-25", "2026-11-25"], 
    ["2026-12-05", "2026-12-10"],
    ["2026-12-25", "2027-01-09"],
  ],

  // Session start times, in order. These become the choices on
  // the page. Add, remove, or change them here only.
  SESSIONS: ["17:30 CST", "19:00 CST"],

  WEEK_STARTS: 0,

  // ROT13 of the address, same as the Contact page. No @ in the file.
  ADDR_USER: "yvtug",
  ADDR_HOST: "nyrkvhf.fghqvb",

  SUBJECT: "Request — Dialogue with Light & Shadow"
};


(function () {
  "use strict";

  var cal      = document.getElementById("req-cal");
  var sessBox  = document.getElementById("req-sessions");
  var note     = document.getElementById("req-note");
  var send     = document.getElementById("req-send");
  var fallback = document.getElementById("req-fallback");
  var addrEl   = document.getElementById("req-addr");
  var tmplEl   = document.getElementById("req-template");
  if (!cal || !send) return;

  function rot13(s) {
    return s.replace(/[a-z]/gi, function (c) {
      var b = c <= "Z" ? 65 : 97;
      return String.fromCharCode((c.charCodeAt(0) - b + 13) % 26 + b);
    });
  }
  var ADDR = rot13(CONFIG.ADDR_USER) + String.fromCharCode(64) + rot13(CONFIG.ADDR_HOST);


  /* ---- dates --------------------------------------------------
     Local dates throughout, never toISOString(): that one is UTC,
     and in Houston after 7pm it is already tomorrow. */
  function ymd(d) {
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
  }
  function daysFromToday(n) {
    var d = new Date();
    d.setHours(12, 0, 0, 0);          // noon: immune to DST edges
    d.setDate(d.getDate() + n);
    return d;
  }
  function parse(s) {
    var p = s.split("-");
    return new Date(+p[0], +p[1] - 1, +p[2], 12);
  }
  function readable(s) {
    return parse(s).toLocaleDateString(undefined,
      { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }

  var earliest = ymd(daysFromToday(CONFIG.LEAD_DAYS));
  var latest   = CONFIG.MAX_DAYS ? ymd(daysFromToday(CONFIG.MAX_DAYS)) : "";

  function away(s) {
    for (var i = 0; i < CONFIG.AWAY.length; i++) {
      // YYYY-MM-DD strings compare correctly as plain text.
      if (s >= CONFIG.AWAY[i][0] && s <= CONFIG.AWAY[i][1]) return true;
    }
    return false;
  }

  function open(s) {
    if (s < earliest) return false;
    if (latest && s > latest) return false;
    if (away(s)) return false;
    return true;
  }


  /* ---- calendar ----------------------------------------------- */
  var selected = "";
  var e0 = parse(earliest);
  var view = { y: e0.getFullYear(), m: e0.getMonth() };
  var minView = { y: view.y, m: view.m };
  var maxView = null;
  if (latest) {
    var l0 = parse(latest);
    maxView = { y: l0.getFullYear(), m: l0.getMonth() };
  }

  function cmp(a, b) { return (a.y - b.y) * 12 + (a.m - b.m); }

  function button(cls, text, label) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = cls;
    b.textContent = text;
    if (label) b.setAttribute("aria-label", label);
    return b;
  }

  function render(refocus) {
    cal.innerHTML = "";

    // Header: previous, month, next.
    var head = document.createElement("div");
    head.className = "cal-head";

    var prev = button("cal-nav", "‹", "Previous month");
    var next = button("cal-nav", "›", "Next month");
    prev.disabled = cmp(view, minView) <= 0;
    next.disabled = maxView ? cmp(view, maxView) >= 0 : false;

    prev.addEventListener("click", function () {
      view.m -= 1; if (view.m < 0) { view.m = 11; view.y -= 1; }
      render();
    });
    next.addEventListener("click", function () {
      view.m += 1; if (view.m > 11) { view.m = 0; view.y += 1; }
      render();
    });

    var month = document.createElement("span");
    month.className = "cal-month";
    month.textContent = new Date(view.y, view.m, 1, 12)
      .toLocaleDateString(undefined, { month: "long", year: "numeric" });

    head.appendChild(prev);
    head.appendChild(month);
    head.appendChild(next);
    cal.appendChild(head);

    // Grid: weekday initials, blanks, days.
    var grid = document.createElement("div");
    grid.className = "cal-grid";

    // 1 January 2023 was a Sunday; offset from it for the initials.
    for (var i = 0; i < 7; i++) {
      var dow = document.createElement("span");
      dow.className = "cal-dow";
      dow.setAttribute("aria-hidden", "true");
      dow.textContent = new Date(2023, 0, 1 + (CONFIG.WEEK_STARTS + i) % 7, 12)
        .toLocaleDateString(undefined, { weekday: "narrow" });
      grid.appendChild(dow);
    }

    var lead = (new Date(view.y, view.m, 1, 12).getDay() - CONFIG.WEEK_STARTS + 7) % 7;
    for (var b = 0; b < lead; b++) grid.appendChild(document.createElement("span"));

    var count = new Date(view.y, view.m + 1, 0, 12).getDate();
    var focusMe = null;

    for (var d = 1; d <= count; d++) {
      var s = ymd(new Date(view.y, view.m, d, 12));
      var isAway = away(s);
      var label = readable(s) + (isAway ? ", unavailable" : "");
      var day = button("cal-day" + (isAway ? " is-away" : ""), String(d), label);

      day.disabled = !open(s);
      day.setAttribute("aria-pressed", s === selected ? "true" : "false");

      (function (s, day) {
        day.addEventListener("click", function () {
          selected = s;
          render(true);
          refresh();
        });
      })(s, day);

      if (s === selected) focusMe = day;
      grid.appendChild(day);
    }

    cal.appendChild(grid);
    if (refocus && focusMe) focusMe.focus();
  }


  /* ---- sessions ----------------------------------------------- */
  CONFIG.SESSIONS.forEach(function (t) {
    var lab = document.createElement("label");
    lab.className = "session-opt";
    var r = document.createElement("input");
    r.type = "radio";
    r.name = "session";
    r.value = t;
    r.addEventListener("change", refresh);
    lab.appendChild(r);
    lab.appendChild(document.createTextNode(t));
    sessBox.appendChild(lab);
  });

  function session() {
    var r = sessBox.querySelector('input[name="session"]:checked');
    return r ? r.value : "";
  }


  /* ---- note and button ---------------------------------------
     The button lights only when an open date and a session are
     both chosen. */
  function refresh() {
    var t = session();
    fallback.hidden = true;

    if (selected) {
      note.textContent = readable(selected) + (t ? ", " + t + "." : ". Choose a session.");
    } else {
      note.textContent = "From " + readable(earliest) + ".";
    }
    send.setAttribute("aria-disabled", (selected && t) ? "false" : "true");
  }

  function body(s, t) {
    return [
      "Requested date: " + readable(s),
      "Session: " + t,
      "",
      "Name: ",
      "Email: ",
      "Phone: ",
      "Desired duration: (minimum 1 hour)",
      "",
      "Anything else: ",
      ""
    ].join("\r\n");
  }

  send.addEventListener("click", function (e) {
    e.preventDefault();
    var t = session();
    if (!selected || !open(selected) || !t) return;

    var subject = CONFIG.SUBJECT + " — " + readable(selected) + ", " + t;
    var text = body(selected, t);

    window.location.href = "mailto:" + ADDR +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(text);

    // If the visitor has no mail app, nothing visible happens. After
    // a moment, show the address and the lines to copy, quietly.
    addrEl.href = "mailto:" + ADDR;
    addrEl.textContent = ADDR;
    tmplEl.textContent = "Subject: " + subject + "\n\n" + text.replace(/\r\n/g, "\n");
    setTimeout(function () { fallback.hidden = false; }, 1500);
  });

  render();
  refresh();
})();
</script>

</body>
</html>
